<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vitula</title>
<style>
  @font-face { font-family: "Pixelify"; src: url("assets/ui/font.ttf"); }
  @font-face { font-family: "Grenze Gotisch"; src: url("assets/ui/grenze_gotisch.ttf"); }
  @font-face { font-family: "Bulletin"; src: url("assets/ui/bulletin.ttf"); }
  html, body { margin: 0; height: 100%; background: #08070a; overflow: hidden; }
  body { height: 100dvh; }
  #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  .preload { font-family: "Pixelify"; position: absolute; left: -999px; }
</style>
</head>
<body>
<div id="game"></div>
<span class="preload">.</span><span class="preload2">.</span>
<script>
  // se algo der errado, mostra o erro na tela (em vez de o jogo simplesmente parar) para podermos corrigir
  window.addEventListener("error", e => {
    let b = document.getElementById("errbox");
    if (!b) { b = document.createElement("div"); b.id = "errbox"; b.style.cssText = "position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:#2a0c0c;color:#f4d0c0;border:1px solid #a33;padding:10px;font:12px monospace;white-space:pre-wrap;max-height:40vh;overflow:auto"; document.body.appendChild(b); }
    b.textContent = "Erro no jogo (tire um print e mande):\n" + (e.message || e) + "\n" + ((e.error && e.error.stack) || (e.filename + ":" + e.lineno));
  });
</script>
